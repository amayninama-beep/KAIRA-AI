<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#05070d"
    >

    <title>KAIRA AI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background:
                radial-gradient(
                    circle at top,
                    #101b35 0%,
                    #05070d 45%,
                    #020308 100%
                );

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow: hidden;
        }

        button,
        textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }


        /* =================================================
           APP
        ================================================= */

        #app {
            width: 100%;
            height: 100dvh;

            display: flex;
            flex-direction: column;

            position: relative;
        }


        /* =================================================
           HEADER
        ================================================= */

        .header {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 18px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(3,6,15,0.75);

            backdrop-filter: blur(18px);

            position: relative;
            z-index: 10;
        }


        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .orb {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffffff,
                    #58a6ff 20%,
                    #315cff 55%,
                    #101b63 100%
                );

            box-shadow:
                0 0 18px
                rgba(60,120,255,0.7),

                0 0 45px
                rgba(60,120,255,0.25);

            animation:
                pulse 3s ease-in-out infinite;
        }


        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }
        }


        .brand-text h1 {
            font-size: 20px;
            letter-spacing: 2px;
        }


        .status {
            font-size: 11px;

            color: #69ff9b;

            margin-top: 3px;

            display: flex;
            align-items: center;
            gap: 5px;
        }


        .status-dot {
            width: 7px;
            height: 7px;

            background: #69ff9b;

            border-radius: 50%;

            box-shadow:
                0 0 10px
                #69ff9b;
        }


        /* =================================================
           HEADER ACTION
        ================================================= */

        .menu-btn {
            width: 40px;
            height: 40px;

            border: 1px solid
                rgba(255,255,255,0.1);

            border-radius: 12px;

            background:
                rgba(255,255,255,0.05);

            color: white;

            font-size: 20px;
        }


        /* =================================================
           CHAT AREA
        ================================================= */

        #chat {
            flex: 1;

            overflow-y: auto;

            padding: 22px 14px 150px;

            scroll-behavior: smooth;
        }


        #chat::-webkit-scrollbar {
            width: 4px;
        }


        #chat::-webkit-scrollbar-thumb {
            background:
                rgba(255,255,255,0.15);

            border-radius: 10px;
        }


        /* =================================================
           WELCOME
        ================================================= */

        .welcome {
            min-height: 60vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 20px;
        }


        .welcome-orb {
            width: 95px;
            height: 95px;

            border-radius: 50%;

            margin-bottom: 25px;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ffffff,
                    #5ca8ff 18%,
                    #315cff 50%,
                    #11154d 100%
                );

            box-shadow:
                0 0 30px
                rgba(70,130,255,0.7),

                0 0 80px
                rgba(70,130,255,0.2);

            animation:
                pulse 3s ease-in-out infinite;
        }


        .welcome h2 {
            font-size: 28px;

            margin-bottom: 10px;

            letter-spacing: 1px;
        }


        .welcome p {
            max-width: 330px;

            color:
                rgba(255,255,255,0.62);

            line-height: 1.6;

            font-size: 14px;
        }


        /* =================================================
           MESSAGE
        ================================================= */

        .message-row {
            display: flex;

            margin-bottom: 16px;

            animation:
                messageIn 0.25s ease;
        }


        @keyframes messageIn {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .message-row.user {
            justify-content: flex-end;
        }


        .message-row.ai {
            justify-content: flex-start;
        }


        .message {
            max-width: 88%;

            padding: 13px 15px;

            border-radius: 18px;

            line-height: 1.55;

            font-size: 15px;

            white-space: pre-wrap;

            word-break: break-word;
        }


        .message.user {
            background:
                linear-gradient(
                    135deg,
                    #315cff,
                    #5136d9
                );

            border-bottom-right-radius: 5px;

            box-shadow:
                0 8px 25px
                rgba(50,70,255,0.18);
        }


        .message.ai {
            background:
                rgba(255,255,255,0.055);

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-bottom-left-radius: 5px;
        }


        .message-label {
            font-size: 10px;

            opacity: 0.5;

            margin-bottom: 5px;
        }


        /* =================================================
           THINKING
        ================================================= */

        .thinking {
            display: flex;
            align-items: center;

            gap: 5px;

            padding: 14px 16px;

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid
                rgba(255,255,255,0.07);

            width: fit-content;

            border-radius: 18px;
        }


        .thinking span {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #7ca8ff;

            animation:
                typing 1.2s infinite;
        }


        .thinking span:nth-child(2) {
            animation-delay: 0.15s;
        }


        .thinking span:nth-child(3) {
            animation-delay: 0.3s;
        }


        @keyframes typing {

            0%,
            60%,
            100% {
                opacity: 0.25;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-4px);
            }
        }


        /* =================================================
           BOTTOM PANEL
        ================================================= */

        .bottom-panel {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            padding:
                10px 12px
                calc(10px + env(safe-area-inset-bottom));

            background:
                linear-gradient(
                    to top,
                    #03050b 70%,
                    transparent
                );

            z-index: 20;
        }


        /* =================================================
           QUICK TOOLS
        ================================================= */

        .quick-tools {
            display: flex;

            gap: 8px;

            overflow-x: auto;

            padding-bottom: 9px;
        }


        .quick-tools::-webkit-scrollbar {
            display: none;
        }


        .tool-btn {
            flex: 0 0 auto;

            border:
                1px solid
                rgba(255,255,255,0.09);

            background:
                rgba(255,255,255,0.055);

            color:
                rgba(255,255,255,0.85);

            padding: 8px 12px;

            border-radius: 20px;

            font-size: 12px;

            white-space: nowrap;
        }


        .tool-btn:active {
            transform: scale(0.96);
        }


        /* =================================================
           INPUT
        ================================================= */

        .input-box {
            display: flex;

            align-items: flex-end;

            gap: 8px;

            padding: 8px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            background:
                rgba(10,14,27,0.92);

            backdrop-filter: blur(20px);

            border-radius: 22px;

            box-shadow:
                0 10px 40px
                rgba(0,0,0,0.4);
        }


        #messageInput {
            flex: 1;

            min-height: 42px;
            max-height: 120px;

            resize: none;

            border: none;
            outline: none;

            background: transparent;

            color: white;

            padding: 10px 8px;

            font-size: 15px;

            line-height: 1.4;
        }


        #messageInput::placeholder {
            color:
                rgba(255,255,255,0.38);
        }


        .icon-btn {
            width: 42px;
            height: 42px;

            flex: 0 0 42px;

            border: none;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.07);

            color: white;

            font-size: 18px;
        }


        .send-btn {
            background:
                linear-gradient(
                    135deg,
                    #315cff,
                    #6337e8
                );

            box-shadow:
                0 5px 18px
                rgba(60,80,255,0.35);
        }


        /* =================================================
           RESPONSIVE
        ================================================= */

        @media (min-width: 700px) {

            .message {
                max-width: 70%;
            }

            #chat {
                padding-left: 8%;
                padding-right: 8%;
            }

            .bottom-panel {
                padding-left: 8%;
                padding-right: 8%;
            }
        }

    </style>
</head>


<body>

<div id="app">

    <!-- ================================================
         HEADER
    ================================================= -->

    <header class="header">

        <div class="brand">

            <div class="orb"></div>

            <div class="brand-text">

                <h1>KAIRA</h1>

                <div class="status">

                    <span class="status-dot"></span>

                    ONLINE

                </div>

            </div>

        </div>


        <button
            class="menu-btn"
            id="menuBtn"
            aria-label="Menu"
        >
            ☰
        </button>

    </header>


    <!-- ================================================
         CHAT
    ================================================= -->

    <main id="chat">

        <section
            class="welcome"
            id="welcome"
        >

            <div class="welcome-orb"></div>

            <h2>नमस्ते 👋</h2>

            <p>
                मैं KAIRA हूँ।<br>
                आपका personal AI assistant.
                आप मुझसे सवाल पूछ सकते हैं,
                बात कर सकते हैं और आगे चलकर
                Vision, Web और कई tools का इस्तेमाल
                कर सकते हैं।
            </p>

        </section>

    </main>


    <!-- ================================================
         BOTTOM
    ================================================= -->

    <div class="bottom-panel">


        <div class="quick-tools">

            <button
                class="tool-btn"
                id="cameraBtn"
            >
                📷 Camera
            </button>


            <button
                class="tool-btn"
                id="screenBtn"
            >
                🖥️ Screen
            </button>


            <button
                class="tool-btn"
                id="voiceBtn"
            >
                🎙️ Voice
            </button>


            <button
                class="tool-btn"
                id="webBtn"
            >
                🌐 Web
            </button>


            <button
                class="tool-btn"
                id="toolsBtn"
            >
                🛠️ Tools
            </button>

        </div>


        <div class="input-box">

            <textarea
                id="messageInput"
                rows="1"
                placeholder="KAIRA से कुछ पूछें..."
            ></textarea>


            <button
                class="icon-btn"
                id="micBtn"
                aria-label="Voice"
            >
                🎤
            </button>


            <button
                class="icon-btn send-btn"
                id="sendBtn"
                aria-label="Send"
            >
                ➤
            </button>

        </div>

    </div>

</div>

    - Messages
    - Weather
    - Memory-ready system

    PART 3 में:
    - Camera
    - Screen Vision
    - Tool routing
    - Web foundation
    - Permissions
-->

</body>
</html>
